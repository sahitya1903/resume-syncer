name: Overleaf Resume Syncer
description: Syncs a resume PDF and LaTeX source from Overleaf to GitHub, with optional Google Drive upload.
author: sahitya1903

inputs:
  overleaf_url:
    required: true
    description: Read-url from overleaf
  github_token:
    required: true
    description: GitHub token for authentication
  resume_name:
    default: resume
    description: Base name of the synced files (e.g. core -> core.tex, core.pdf); use a different name per resume
  gdrive_link:
    description: Google drive link with edit permission
  gdrive_service_account_key:
    description: Service account JSON key string for Google Drive access

runs:
  using: 'composite'
  steps:
    - name: Checkout repo
      uses: actions/checkout@v7
      with:
        token: ${{ inputs.github_token }}

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: 3.x

    - name: Install dependencies
      run: pip install -r "${{ github.action_path }}/requirements.txt"
      shell: bash

    - name: Run Selenium script
      id: script
      run: python "${GITHUB_ACTION_PATH}/selenium_script.py" "${{ inputs.overleaf_url }}" "$RESUME_NAME"
      env:
        RESUME_NAME: ${{ inputs.resume_name }}
      shell: bash

    - name: Commit resume files
      if: steps.script.outputs.skip != 'True'
      run: |
        # Move HEAD and the index to the latest remote commit while keeping the new resume
        # files in the working tree, so the commit never conflicts with pushes made mid-run
        BRANCH_NAME="${GITHUB_REF_NAME:-main}"
        git fetch origin "$BRANCH_NAME"
        git reset FETCH_HEAD

        git config user.email "github-actions[bot]@users.noreply.github.com"
        git config user.name "github-actions[bot]"

        git add -f "$RESUME_NAME.tex" "$RESUME_NAME.pdf"
        if git diff --cached --quiet; then
          echo "No changes to commit."
        else
          git commit -m "Resume updated ($RESUME_NAME)"
          git push origin "HEAD:$BRANCH_NAME"
        fi
      env:
        RESUME_NAME: ${{ inputs.resume_name }}
      shell: bash

    - name: Upload to google drive
      if: inputs.gdrive_link != '' && inputs.gdrive_service_account_key != '' && steps.script.outputs.skip != 'True'
      run: python "${GITHUB_ACTION_PATH}/upload_to_gdrive.py" "$RESUME_NAME"
      env:
        RESUME_NAME: ${{ inputs.resume_name }}
        GDRIVE_LINK: ${{ inputs.gdrive_link }}
        GDRIVE_SERVICE_ACCOUNT_KEY: ${{ inputs.gdrive_service_account_key }}
      shell: bash

branding:
  icon: 'aperture'
  color: 'green'
