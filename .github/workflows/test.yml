name: Resume Syncer
on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  sync-resume:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # One step per resume; each needs a distinct resume_name so their files don't overwrite each other
      - name: Sync core resume
        uses: ./ # Uses action.yml in the root directory
        with:
          resume_name: core
          overleaf_url: ${{ secrets.OVERLEAF_URL_CORE }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

          # Optional: Google Drive sync configuration
          gdrive_link: ${{ secrets.GDRIVE_LINK_CORE }}
          gdrive_service_account_key: ${{ secrets.GDRIVE_SERVICE_ACCOUNT }}

      - name: Sync IT resume
        uses: ./
        with:
          resume_name: it
          overleaf_url: ${{ secrets.OVERLEAF_URL_IT }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

          gdrive_link: ${{ secrets.GDRIVE_LINK_IT }}
          gdrive_service_account_key: ${{ secrets.GDRIVE_SERVICE_ACCOUNT }}
